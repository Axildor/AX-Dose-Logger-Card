name: Release

# Builds the card on every tag push, then attaches the compiled
# `dist/ax-dose-logger-card.js` to the matching GitHub Release.
#
# Why this exists:
#   HACS plugins must ship the compiled JS as a GitHub Release asset
#   (the repo's `dist/` is intentionally gitignored).  Without an asset
#   attached to the release, HACS reports:
#     "Repository structure for <tag> is not compliant"
#   This workflow automates that step so it can never be missed.
#
# The asset filename is preserved as `ax-dose-logger-card.js` to match
# the `filename` declared in `hacs.json`.

on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Enable Corepack (Yarn Berry)
        # The repo uses Yarn Berry (v4) with a .yarnrc.yml and a v4-format
        # yarn.lock. setup-node ships Yarn Classic by default, which cannot
        # parse the v4 lockfile. Corepack reads the `packageManager` field
        # in package.json and installs the matching Yarn release.
        run: corepack enable

      - name: Install dependencies
        # --immutable is the Yarn 4 successor to --frozen-lockfile.
        run: yarn install --immutable

      - name: Build card
        run: yarn run build

      - name: Attach ax-dose-logger-card.js to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ax-dose-logger-card.js